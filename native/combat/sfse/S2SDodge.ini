; S2SDodge: TK Dodge style dodging for Starfield, standalone (the dodge part of S2SCombat; do not install both).
; Data\SFSE\Plugins\S2SDodge.ini. Needs the dodge animations of the same mod (SAM fragment S2SDodge) and SAM.
; Key codes: SFSE's (keyboard = DirectInput scan codes: 56 left Alt, 42 left Shift, 57 Space; mouse 256 + button).

[Plugin]
bEnabled = 1
; Make the player a ghost (Actor.SetGhost) while the dodge's i-frames run: hits pass through.
bGhostDuringIframes = 1
; Actor value the dodge cost is taken from (EditorID). Empty = no cost (Starfield has no stamina).
sStaminaActorValue =
; First N keys / animation events / commands written to SFSE\Plugins\S2SDodge.log (0 = none).
iLogKeys = 20
iLogAnimEvents = 0
iLogCommands = 40
; Graph bools set to 1 on the player while a dodge runs and back to 0 after. bNoAim switches off the melee graph's
; aim (Dual Direct At): in the combat stance its aim poses held the left arm out over the dodge (owner's run
; 2026-11-23). Head tracking stays on: it turns the head back toward the view during the forward dodge.
sDodgeGraphBools = bNoAim
; Graph variables written to the log at each dodge's start, 0.25 s in and at its end: name (bool), name:i, name:f.
sLogGraphVariables = bAimActive, bNoAim, bHeadTrackingActive, BoneWeightsAction:i, iSyncRelaxReadySneak:i
iLogDodges = 20

[Combat]
; Dodge key; direction from the movement keys (or the left stick), standing still dodges backwards.
uDodgeKey = 56
uMoveForwardKey = 17
uMoveBackKey = 31
uMoveLeftKey = 30
uMoveRightKey = 32
; Graph event per direction: the dodge states of S2SDodge's MeleeAttacks.agx listen to these (the NPC melee attack
; events, which the game never sends to the player; Starfield's graphs take only event names they know).
sDodgeEvents = Forward=MeleeAttack01, Back=MeleeAttack02, Left=MeleeAttack03, Right=MeleeAttack04
sIdleDodge = Back
bEightWayDodge = 0
; Dodge out of an attack.
bDodgeCancelsAttacks = 1
fDodgeStaminaCost = 0
; Seconds of i-frames from the press.
fDodgeIframes = 0.3
