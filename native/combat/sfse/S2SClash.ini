; S2SClash - weapon clash standoffs, an add-on to S2S Combat (needs S2SCombat.dll; S2SCombat works without this).
; Goes in Data\SFSE\Plugins\ next to S2SClash.dll. The spark effects come from S2SCombat.ini's sTimedBlockEffect, the
; attack / move keys from its [Combat] section, the camera from its lock-on.

[Clash]
; Weapon clash (Cinematic Clash style): a perfect block locks both blades together and you mash attack against a
; meter. The meter starts in the middle; your presses push it your way, the opponent pushes it back at a steady rate.
; Full = you win (they stagger), empty = you lose (you stagger), time out = a draw (both recoil).
bEnabled = 1
; Start a clash on a perfect block (fPerfectBlockWindow in [Combat]) instead of the attacker's parry stagger.
bOnPerfectBlock = 1
fTriggerChance = 100
fCooldownSeconds = 1
; Furthest apart (game units, ~metres) the two may be for a clash to start.
fMaxStartDistance = 3
fDuration = 5
; Seconds at the start while the lock forms (guards come up, the camera swings round): the meter does not move.
fGraceTime = 0.6
; Meter per attack press (the meter runs 0..1).
fPressGain = 0.09
; How hard the opponent pushes back: the presses per second that exactly hold the meter still.
; 0 = easy, 1 = normal, 2 = hard.
iMode = 1
fEasyPressesPerSecond = 3
fNormalPressesPerSecond = 4
fHardPressesPerSecond = 5
; Hold attack instead of mashing (a hold matches an equal opponent: the clash ends in a draw).
bHoldToMash = 0
; Time out: 0 = a draw, 1 = the side the meter favours wins.
iTimeoutResolution = 0
; Distance between the two while locked (game units, ~metres), and the opponent is moved there facing you.
fClashDistance = 0.7
bPlaceOpponent = 1
; The opponent stops attacking / walking while locked (Actor.SetRestrained).
bRestrainOpponent = 1
; Lock-on to the opponent for the clash (released afterwards unless you had it on).
bLockCamera = 1
; The view while locked (degrees): fCameraYaw turns it off the opponent (+ swings the camera round to your left so both
; of you show side-on; 0 = straight at them); fCameraPitch is the camera's tilt, held (+ = looking down, 0 = level).
fCameraYaw = 35
fCameraPitch = 8
; Movement and the block key do not reach the game while locked; you take no hits while locked.
bBlockMovement = 1
bGhostPlayer = 1
; Turn you and the opponent to face each other: both for fSettleTime seconds, then only your heading is held (put back
; when it drifts more than half a degree).
bFaceEachOther = 1
fSettleTime = 0.5
; Animation events kept from both of you for the whole clash (name prefixes, any case): attacks, hit reactions, the
; block dropping, walking, turning. The plugin's own events always pass. Empty = none kept.
sBlockedEvents = MeleeAttackStart, MeleeAttackPowerStart, MeleeAttack0, attackStart, attackPowerStart, attackRelease, bashStart, recoilStart, recoilLargeStart, StaggerStart, BlockStop, blockHitStart, moveStart, turnLeft, turnRight, turnStart, SprintStart, JumpStart, JumpStanding, JumpDirectional, IdleForceDefaultState, weaponSheathe, WeapUnequip, Unequip
; Graph floats set to 0 on both every frame so the legs stay planted (only those the game has; the log lists them).
sZeroVariables = Speed, SpeedSampled, Direction, TurnDelta
; Graph events (first one the graph takes): the attack interrupt sent to both at the start, both guards (sent again every fGuardInterval s), the opponent's int set to
; 1 while locked, the loser / winner / draw reactions, and the player's event when it is over.
sInterruptEvents = ActionInterrupt
sGuardEvents = BlockStart
fGuardInterval = 0.5
sGuardVariable = iWantBlock
sLoserEvents = StaggerStart, recoilLargeStart, recoilStart
sWinnerEvents =
sDrawEvents = recoilStart, StaggerStart
; Float graph variable set on whoever staggers (Skyrim's staggerMagnitude; empty = none), and its values.
sStaggerVariable = staggerMagnitude
fLoserStaggerMagnitude = 1.0
fDrawStaggerMagnitude = 0.25
sEndEvents = BlockStop
; Messages (there is no on-screen meter yet: these say how it is going). Empty = none.
bMessages = 1
sStart = Weapon clash! Mash attack!
sStartHold = Weapon clash! Hold attack!
sWin = You overpowered your opponent!
sLose = You were overpowered!
sDraw = Neither of you gives way!
sWinning = Pushing them back...
sLosing = Losing ground...
bShakeOnPress = 1
fShakeStrength = 0.12
; Seconds between spark bursts (S2SCombat.ini [Plugin] sTimedBlockEffect); 0 = none. Off: they only play on the floor.
fSparkInterval = 0
; Testing: every melee hit you land starts a clash (cooldown still applies). Leave at 0 for normal play.
bForceClashOnHit = 0
