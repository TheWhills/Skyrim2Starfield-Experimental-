; S2SCombat settings. Copy to <Starfield>\Data\SFSE\Plugins\S2SCombat.ini (or into the mod folder at the same path).
; Key codes are SFSE / Key Utils codes: keyboard = DirectInput scan code (17 W, 30 A, 31 S, 32 D, 42 left Shift,
; 56 left Alt, 200 Up, 203 Left, 205 Right, 208 Down), mouse 256 left / 257 right / 258 middle / 259-263 extra,
; wheel 264 up / 265 down, gamepad 266 D-pad up ... 281 right trigger (SFSE InputMap order).

[Plugin]
bEnabled = 1
; First N key / button events and first N animation events of the player go to the log
; (Documents\My Games\Starfield\SFSE\Logs\S2SCombat.log). Leave on for the first runs: they verify the hooks.
iLogKeys = 40
iLogAnimEvents = 300
; First N menu open / close events go to the log (checks the menu names below).
iLogMenus = 60
; First N hits on the player go to the log (attacker, weapon, attack event, blocking, i-frames).
iLogHits = 30
; First N actions the plugin carries out (graph event sent, keyword set, lock-on) with their result.
iLogCommands = 400
; For this many seconds after loading, the plugin's own time per frame and per animation event is logged every 10 s.
iPerfSeconds = 60
; 1 = find the animation event layout again at load (only after a game update; 0 uses Starfield 1.16's).
bProbeEventLayout = 0
; Timed-block feedback. sTimedBlockEffect: an ImpactDataSet EditorID played from sTimedBlockEffectNode toward the
; attacker (empty = the best spark set found by bListEffectForms; the log lists the candidates). fTimedBlockShake:
; camera shake strength (0 = off) for fTimedBlockShakeTime seconds.
sTimedBlockEffect =
sTimedBlockEffectNode = Weapon
fTimedBlockShake = 0.4
fTimedBlockShakeTime = 0.15
; Once per session, after loading: log the game's spark-like impact sets / explosions (a short pause, ~0.5 s).
bListEffectForms = 1
; Menus during which key presses are ignored (comma separated). Empty = the built-in list (console, pause, inventory,
; data menus, dialogue, containers, star map, ship builder, ...).
sBlockingMenus =
; Make the player a ghost (Actor.SetGhost) while dodge i-frames run. Until the plugin has a hit hook.
bGhostDuringIframes = 1
; Actor value the dodge cost is taken from (EditorID). Empty = no cost. Starfield has no stamina; candidates are
; owner decisions (e.g. the oxygen value).
sStaminaActorValue =

[Combat]
; MCO-style input buffer: an attack pressed while the next-attack window is closed fires when it opens.
bBufferAttacks = 1
fBufferTime = 0.35
fPowerHold = 0.30
fChargeHold = 0.80
uAttackKey = 256
; TK Dodge: direction from movement keys / left stick; standing still dodges backwards.
uDodgeKey = 56
; Starfield's power attack key (the "Melee" control, V = 47). Pressed during a combo, the plugin starts the combo's
; power attack (bPowerInCombo); standing, the game handles it as usual.
uPowerAttackKey = 47
uMoveForwardKey = 17
uMoveBackKey = 31
uMoveLeftKey = 30
uMoveRightKey = 32
bEightWayDodge = 0
; Graph event per dodge direction. Starfield's graphs only take event names they already know, so the stance packs'
; dodge states use the NPC melee attack events (never sent to the player). Unlisted directions send TKDodge<Direction>.
sDodgeEvents = Forward=MeleeAttack01, Back=MeleeAttack02, Left=MeleeAttack03, Right=MeleeAttack04
sIdleDodge = Back
bDodgeCancelsAttacks = 1
fDodgeStaminaCost = 0
fDodgeIframes = 0.3
fAnnotationIframes = 0.3
; Graph events the buffer sends (Starfield's melee events).
sAttackEvent = MeleeAttackStart
sPowerAttackEvent = MeleeAttackPowerStart
; The power attack started mid-combo (bPowerInCombo): the stance packs' combo -> power attacks listen to this event:
; MeleeAttackPowerStart for all packs (a plugin-only name such as S2S_ComboPower is not taken by the graph).
sComboPowerEvent = MeleeAttackPowerStart
; 1 = cancel the standing power attack the game queues from a mid-combo power key press and plays after the combo
; (it shows as an AttackStart with no attack press and nothing sent by the plugin): the plugin sends
; sQueuedPowerCancelEvent, which the stance packs (v5 on) route back to idle. fQueuedPowerWindow: how long after the
; last mid-combo press (or the last cancel) such an attack counts as queued.
bCancelQueuedPower = 1
fQueuedPowerWindow = 3.0
sQueuedPowerCancelEvent = ActionInterrupt
; Empty: clip events arrive as Skyrim wrote them (event "PIE", payload "@SGVI|MCO_nextattack|2").
; Set to an event name if converted clips carry the whole Skyrim annotation in the payload of that event.
sPluginEventHost =
; Graph events sent after a stance change, comma separated (Skyrim's Stances sends blockStart, blockStop so the
; animation set is picked again). Try BlockStart, BlockStop if a stance only applies after sheathing and drawing.
sStanceRefreshEvents =
; 1 = the power attack key (or a held attack) during a combo sends the power attack event at once (the stance packs' combo -> power attacks
; need it: vanilla Starfield only starts a power attack from standing). 0 = wait for the clip's power window (MCO).
bPowerInCombo = 1
; 1 = pressing the active stance's key again goes back to neutral (LoreRim's toggle); 0 = it keeps the stance.
bStanceRepeatNeutral = 0
; 1 = re-equip the weapon after a stance change, so the new stance's attacks apply at once (Starfield picks the
; animation set when a weapon is equipped). Waits until the stance keys are quiet for fStanceReequipDelay seconds.
; The weapon is unequipped first and equipped again when the game reports the unequip (UnequipComplete), or after
; fStanceReequipWait seconds if it does not.
bStanceReequip = 1
fStanceReequipDelay = 0.25
fStanceReequipWait = 0.5
; Graph variable set when you are hit while blocking: 0 normal, 1 power attack (for block-hit variants). Empty = off.
; Off until the graph has block-hit variants that read it (the owner's game crashed right after the first one was set;
; the other suspect, the health give-back, now goes through Papyrus).
sBlockHitVariable =
; Timed block: a hit within fTimedBlockWindow seconds of pressing block (once per press) does no damage, staggers the
; attacker (the first of sParryEvents its graph takes; the log says which) and shows sTimedBlockMessage. 0 = off.
fTimedBlockWindow = 0.25
bParryRestoreHealth = 1
sParryEvents = StaggerStart, recoilStart, recoilLargeStart
sTimedBlockMessage = Timed block
; Any other hit while blocking: this share of its damage is given back (0 = the game's damage as is).
fBlockReduction = 0.6
; The game drops the guard ~0.3 s after a blocked hit; while the block key stays down the plugin raises it again with
; this graph event (within fBlockReraiseWindow seconds of the hit). Empty = off.
sBlockReraiseEvent = BlockStart
fBlockReraiseWindow = 1.5

[Lock]
; Lock-on (True Directional Movement style): the key in [Keys] toggles it; the player (and the third-person camera
; behind it) turns toward the target. Distances in game units, taken as metres (the log prints the distance on lock).
fMaxDistance = 28.0
fTargetHeight = 1.3
fEyeHeight = 1.6
; How fast the view turns to the target (TDM's defaults: yaw 8, pitch 2). bSteerPitch = 0 leaves up / down to you.
fYawRate = 8.0
fPitchRate = 2.0
bSteerPitch = 1
; 1 = hold the view on the target every frame (TDM-like hard lock); 0 = ease toward it at fYawRate / fPitchRate.
bHardLock = 1
; Hard lock: share of the up / down error closed each frame (0.2 smoother .. 1 snappier; above 1 can wobble).
fPitchGain = 0.5
; A new lock swings the view onto the target over fAcquireTime seconds (smooth start and stop), then holds it.
fAcquireTime = 0.4
; 1 = mouse look and the right stick do not move the camera while locked (release the lock to look around).
bBlockLook = 1
; 1 = aim from the camera's position, so the crosshair lands on the target; 0 = from the player's eye.
bAimFromCamera = 1
; 1 = also turn the player's heading toward the target. Off: Starfield's third-person camera does not follow the
; heading (owner), so the player turned while the view did not. The camera's own rotation is still being found:
; iCameraSamples camera-probe lines go to the log while locked (turn the camera with the mouse meanwhile).
bSteerPlayer = 0
; 1 = turn the third-person camera toward the target (its rotation, found with the camera probe on 1.16.244).
bSteerCamera = 1
iCameraSamples = 0
; -1 if the view tilts away from the target instead of toward it.
fPitchSign = 1.0
bHostileOnly = 1
; Graph bool set while locked (movesets' TDM conditions). Empty = none.
sLockVariable = TDM_TargetLock
iLogTargets = 20

[Keys]
; name = key|action|argument   (Key Utils / Stances style)
; actions: event (graph event), int / bool / float (graph variable, argument Name=Value), keyword (stance: an actor
; keyword; keyword bindings are one exclusive group, pressing the active one again leaves it), dodge, lock,
; switch_left / switch_right / switch_up / switch_down.
; Stances (LoreRim / Stances - Dynamic Weapon Movesets): up = high, left = mid, down = low, right = neutral. The keywords
; come from S2SStances.esm (scripts/armor/stance_plugin.py); without it the log says "keyword ... not found".
stance_high = 200|keyword|S2S_StanceHigh
stance_mid = 203|keyword|S2S_StanceMid
stance_low = 208|keyword|S2S_StanceLow
stance_neutral = 205|keyword
; Lock-on: mouse button 4 (260; the middle button, TDM's default 258, is Starfield's TogglePOV) or the right stick
; click; switch targets with the keys below.
lock_mouse = 260|lock
; A keyboard lock-on key (pick one Starfield does not use for you; Caps Lock is its walk / run toggle), e.g.
;lock_key = 44|lock
lock_pad = 273|lock
;switch_left = 16|switch_left
;switch_right = 18|switch_right
